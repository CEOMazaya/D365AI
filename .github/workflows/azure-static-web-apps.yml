name: Deploy portal to Azure Static Web Apps

# Builds portal/ with Vite and deploys the dist/ output to Azure Static Web Apps.
# Azure creates this file for you when you connect the repo in the portal — this
# committed copy documents the exact build settings and lets you edit them.
#
# Requires one repo secret (Azure adds it automatically on resource creation):
#   AZURE_STATIC_WEB_APPS_API_TOKEN

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build and deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # Folder containing package.json
          app_location: "portal"
          # No backend yet — leave empty
          api_location: ""
          # Vite build output, relative to app_location
          output_location: "dist"

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close pull request
    steps:
      - name: Close pull request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
